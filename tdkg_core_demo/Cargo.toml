[package]
name = "tdkg_core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust library for threshold distributed key generation"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "tdkg_core"
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[build-dependencies]
cbindgen = "0.24" 