[package]
name = "dkg-node"
version = "0.1.0"
edition = "2021"

[dependencies]
cggmp21 = { version = "0.6", features = ["curve-secp256k1", "state-machine", "spof"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"
rand = "0.8"
round-based = { version = "0.4", features = ["state-machine", "sim"] }
sha2 = "0.10"
futures = "0.3"

 